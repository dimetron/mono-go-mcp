name: secrets

# Gitleaks: fail on hardcoded secrets in commits and diff of a PR.
# Local commits are already blocked by the pre-commit hook; this is the
# server-side backstop (hooks can be bypassed with --no-verify).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # SARIF upload to the code-scanning dashboard

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # full history: gitleaks scans every commit

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}