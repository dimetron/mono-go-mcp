version: '3'

vars:
  APP: mono-go-mcp
  CLI: mono-go-cli
  VERSION: 0.1.0
  BIN_DIR: bin
  BIN: '{{.BIN_DIR}}/{{.APP}}'
  CLI_BIN: '{{.BIN_DIR}}/{{.CLI}}'
  # Where the binaries are installed by `task install` ($HOME/go/bin by
  # default; shell-expanded at command time, so a custom GOPATH wins).
  INSTALL_DIR: '$(go env GOPATH)/bin'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # === Build ===

  build:
    desc: Build the server and CLI binaries into bin/
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/mono-go-mcp
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o "{{.CLI_BIN}}" ./cmd/mono-go-cli
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BIN}}'
      - '{{.CLI_BIN}}'

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  # === Install ===

  install:
    desc: Build and install both binaries into $GOPATH/bin
    deps: [build]
    cmds:
      - mkdir -p "{{.INSTALL_DIR}}"
      - cp "{{.BIN}}" "{{.INSTALL_DIR}}/{{.APP}}"
      - cp "{{.CLI_BIN}}" "{{.INSTALL_DIR}}/{{.CLI}}"
      - echo "Installed {{.INSTALL_DIR}}/{{.APP}} and {{.INSTALL_DIR}}/{{.CLI}}"

  uninstall:
    desc: Remove the installed binaries from $GOPATH/bin
    cmds:
      - rm -f "{{.INSTALL_DIR}}/{{.APP}}" "{{.INSTALL_DIR}}/{{.CLI}}"
      - echo "Removed {{.INSTALL_DIR}}/{{.APP}} and {{.INSTALL_DIR}}/{{.CLI}} (if they existed)"

  release:check:
    desc: Validate .goreleaser.yaml
    cmds:
      - goreleaser check

  release:build:
    desc: Dry-run release cross-builds into dist/ (all 5 OS/arch targets)
    cmds:
      - goreleaser build --snapshot --clean --skip=validate
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
      - .goreleaser.yaml

  release:clean:
    desc: Remove goreleaser dist/ output
    cmds:
      - rm -rf dist

  # === Quality ===

  check:
    desc: Format check, vet, and build everything
    cmds:
      - gofmt -l . | tee /dev/stderr | (! grep -q .)
      - go vet ./...
      - go build ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  smoke:
    desc: Run the CLI against the real monobank API (default output; with MONO_TOKEN also statements)
    aliases: [cli]
    cmds:
      - go run ./cmd/mono-go-cli

  run:
    desc: Run the MCP server locally (reads .env, needs a terminal with an MCP client)
    deps: [build]
    cmds:
      - '{{.BIN}}'

  upgrade:
    desc: Update dependencies to latest
    cmds:
      - go get -u ./...
      - go mod tidy